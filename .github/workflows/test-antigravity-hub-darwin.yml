# Throwaway workflow for testing NixOS/nixpkgs#566473; not meant for upstream.
name: Test antigravity-hub on aarch64-darwin

on:
  push:
    branches: [test-antigravity-hub-darwin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build
        env:
          NIXPKGS_ALLOW_UNFREE: 1
        run: nix-build -A antigravity-hub --out-link result

      - name: Inspect output
        run: |
          uname -m
          ls -la result/ result/bin/ result/Applications/
          cat result/bin/antigravity
          find result/Applications/Antigravity.app -type l | wc -l

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 result/Applications/Antigravity.app
          codesign -dv --verbose=2 result/Applications/Antigravity.app

      - name: Gatekeeper assessment (informational)
        continue-on-error: true
        run: spctl --assess --type execute --verbose=4 result/Applications/Antigravity.app

      - name: Launch via bin/antigravity
        run: |
          result/bin/antigravity > launch.log 2>&1 &
          pid=$!
          sleep 30
          screencapture -x screenshot.png || true
          pgrep -fl Antigravity || true
          if kill -0 "$pid" 2>/dev/null; then
            echo "Antigravity is still running after 30s"
            kill "$pid"
          else
            wait "$pid"; code=$?
            echo "Antigravity exited early with status $code"
            cat launch.log
            exit 1
          fi
          cat launch.log

      - name: Launch via open (app bundle)
        run: |
          pkill -f Antigravity.app || true
          sleep 2
          open -W -a "$PWD/result/Applications/Antigravity.app" &
          sleep 20
          pgrep -fl Antigravity.app/Contents/MacOS/Antigravity
          pkill -f Antigravity.app || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: antigravity-hub-darwin
          path: |
            screenshot.png
            launch.log
